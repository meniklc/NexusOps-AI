# ---------------------------------------------------------------------------
# Local dev stack: pgvector + FastAPI backend + Streamlit frontend.
#   docker compose up --build
# Then ingest sample docs:
#   docker compose exec backend python -m scripts.ingest sample_docs
# ---------------------------------------------------------------------------
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag} -d ${POSTGRES_DB:-ragdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      # Override host so the backend reaches the db service inside the compose network.
      POSTGRES_HOST: db
    # Lets the container reach an Ollama server running on the host machine at
    # host.docker.internal (see OLLAMA_BASE_URL). Docker Desktop on Win/Mac
    # provides this automatically; the mapping is required on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn app.api.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    env_file: .env
    environment:
      # Inside the compose network the backend is reachable by service name.
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "8501:8501"
    command: streamlit run frontend/app.py --server.address 0.0.0.0 --server.port 8501

volumes:
  pgdata:
